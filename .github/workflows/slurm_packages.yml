name: Build slurm packages

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.source.name }} / ${{ matrix.distribution }} / ${{ matrix.platform }}
    permissions:
      contents: read
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix:
        source:
          - name: 25.05.6
            version: 25.05.6
          - name: 25.11.5
            version: 25.11.5
          - name: 26.05.3-nebius-1-rc3
            version: 26.05.3-nebius-1-rc3
            source_url: https://github.com/nebius/slurm/releases/download/slurm-26-05-3-nebius-1-rc3/slurm-26.05.3-nebius-1-rc3.tar.gz
        distribution:
          - ubuntu24.04
        platform:
          - linux/amd64
          - linux/arm64
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
            ld_library_path: /usr/mpi/gcc/openmpi-${OPENMPI_VERSION}/lib:/lib/x86_64-linux-gnu:/usr/lib/x86_64-linux-gnu
            base_image: cr.eu-north1.nebius.cloud/ml-containers/neubuntu:noble-20260202145316
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            ld_library_path: /usr/mpi/gcc/openmpi-${OPENMPI_VERSION}/lib:/lib/aarch64-linux-gnu:/usr/lib/aarch64-linux-gnu
            base_image: cr.eu-north1.nebius.cloud/ml-containers/neubuntu:noble-20260202145316

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Get short commit hash
        run: echo "SHORT_SHA=$(git rev-parse --short=8 HEAD)" >> "$GITHUB_ENV"

      - name: Build docker image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          file: slurm-packages/Dockerfile
          push: false
          tags: slurm_packages:${{ matrix.source.name }}-${{ env.SHORT_SHA }}
          platforms: ${{ matrix.platform }}
          load: true
          build-args: |
            SLURM_VERSION=${{ matrix.source.version }}
            SLURM_SOURCE_URL=${{ matrix.source.source_url }}
            LD_LIBRARY_PATH=${{ matrix.ld_library_path }}
            BASE_IMAGE=${{ matrix.base_image }}

      - name: Create slurm_packages_output directory
        run: mkdir -p slurm_packages_output/debs

      - name: Run Docker container and copy files
        run: |
          container_id=$(docker create slurm_packages:${{ matrix.source.name }}-${{ env.SHORT_SHA }})
          docker cp "$container_id:/usr/src/debs/." ./slurm_packages_output/debs/
          docker rm "$container_id"

      - name: Normalize platform for artifact names
        run: echo "PLATFORM_SAFE=${{ matrix.platform }}" | sed 's/\//-/g' >> "$GITHUB_ENV"

      - name: Upload DEB packages as artifact
        uses: actions/upload-artifact@v7
        with:
          name: debs-${{ matrix.distribution }}-${{ matrix.source.name }}-${{ env.PLATFORM_SAFE }}
          path: slurm_packages_output/debs/*.deb
          if-no-files-found: error
          retention-days: 7

      - name: Cleanup
        run: rm -rf slurm_packages_output


  release:
    name: Release ${{ matrix.source.name }} / ${{ matrix.distribution }}
    needs: [build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    strategy:
      fail-fast: false
      matrix:
        source:
          - name: 25.05.6
            source_ref: SchedMD/slurm@slurm-25-05-6-1
          - name: 25.11.5
            source_ref: SchedMD/slurm@slurm-25-11-5-1
          - name: 26.05.3-nebius-1-rc3
            source_ref: nebius/slurm@slurm-26-05-3-nebius-1-rc3
        distribution:
          - ubuntu24.04

    concurrency:
      group: release-slurm-packages-${{ matrix.distribution }}-${{ matrix.source.name }}
      cancel-in-progress: false

    steps:
      - name: Download all DEB artifacts for this source
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          pattern: debs-${{ matrix.distribution }}-${{ matrix.source.name }}-*
          merge-multiple: true

      - name: Show downloaded packages
        run: find artifacts -type f -name '*.deb' -print

      - name: Create GitHub Release and upload DEBs
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: slurm-packages-${{ matrix.distribution }}-${{ matrix.source.name }}
          name: Slurm packages ${{ matrix.source.name }} for ${{ matrix.distribution }}
          body: |
            Source: `${{ matrix.source.source_ref }}`

            Packages are built for both amd64 and arm64.
          draft: false
          prerelease: ${{ contains(matrix.source.name, '-rc') }}
          fail_on_unmatched_files: true
          files: |
            artifacts/**/*.deb
