name: Build pyxis

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build for ${{ matrix.platform }} / ${{ matrix.distribution }} / ${{ matrix.slurm.version }}
    permissions:
      contents: read
      actions: read  # to download slurm debs from slurm_packages.yml artifacts
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix:
        slurm:
          - version: 25.11.8
            apt_version: 25.11.8-1
          - version: 26.05.4-nebius-1
            apt_version: 26.05.4-nebius-1
        enroot:
          - version: 4.2.1
        pyxis:
          - version: 0.24.0
        distribution:
          - ubuntu24.04
          - ubuntu26.04
        platform:
          - linux/amd64
          - linux/arm64
        include:
          - distribution: ubuntu24.04
            base_image: cr.eu-north1.nebius.cloud/ml-containers/neubuntu:noble-20260220113744
          - distribution: ubuntu26.04
            base_image: cr.nebius.cloud/ml-containers/neubuntu:resolute-20261014134004
            # Nebius apt repo has no resolute suite yet: take enroot from NVIDIA
            # releases and slurm from this repo's slurm_packages.yml artifacts
            debs_from_github: true
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0

      - name: Normalize platform for artifact names
        run: echo "PLATFORM_SAFE=${{ matrix.platform }}" | sed 's/\//-/g' >> "$GITHUB_ENV"

      - name: Download slurm debs from the latest slurm_packages.yml artifact
        if: matrix.debs_from_github
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ARTIFACT: debs-${{ matrix.distribution }}-${{ matrix.slurm.version }}-${{ env.PLATFORM_SAFE }}
        run: |
          run_id=$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=${ARTIFACT}&per_page=100" \
            --jq '[.artifacts[] | select(.expired | not)] | sort_by(.created_at) | last | .workflow_run.id // empty')
          if [ -z "${run_id}" ]; then
            echo "::error::No unexpired artifact ${ARTIFACT}, run slurm_packages.yml first"
            exit 1
          fi
          echo "Using ${ARTIFACT} from ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${run_id}"
          gh run download "${run_id}" -R "${GITHUB_REPOSITORY}" -n "${ARTIFACT}" -D slurm_debs
          ls -l slurm_debs

      - name: Build docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          file: pyxis/Dockerfile
          push: false
          tags: pyxis_builder:slurm_${{ matrix.slurm.version }}_enroot_${{ matrix.enroot.version }}_pyxis_${{ matrix.pyxis.version }}_${{ matrix.distribution }}
          platforms: ${{ matrix.platform }}
          load: true
          build-contexts: ${{ matrix.debs_from_github && 'slurm_debs=slurm_debs' || '' }}
          build-args: |
            SLURM_VERSION=${{ matrix.slurm.version }}
            SLURM_APT_VERSION=${{ matrix.slurm.apt_version }}
            ENROOT_VERSION=${{ matrix.enroot.version }}
            PYXIS_VERSION=${{ matrix.pyxis.version }}
            BASE_IMAGE=${{ matrix.base_image }}
            ENROOT_DEBS_URL=${{ matrix.debs_from_github && format('https://github.com/NVIDIA/enroot/releases/download/v{0}', matrix.enroot.version) || '' }}

      - name: Create pyxis_build_output directory
        run: mkdir -p pyxis_build_output/debs

      - name: Run Docker container and copy files
        run: |
          container_id=$(docker create pyxis_builder:slurm_${{ matrix.slurm.version }}_enroot_${{ matrix.enroot.version }}_pyxis_${{ matrix.pyxis.version }}_${{ matrix.distribution }})
          docker start $container_id
          docker cp $container_id:/usr/src/debs/. ./pyxis_build_output/debs/
          docker stop $container_id
          docker rm $container_id

      - name: Upload DEB packages as artifact
        uses: actions/upload-artifact@v7
        with:
          name: debs-${{ matrix.distribution }}-pyxis_${{ matrix.pyxis.version }}-slurm_${{ matrix.slurm.version }}-enroot_${{ matrix.enroot.version }}-${{ env.PLATFORM_SAFE }}
          path: pyxis_build_output/debs/*.deb
          if-no-files-found: error
          retention-days: 7

      - name: Cleanup
        run: rm -rf pyxis_build_output


  release:
    name: Release pyxis ${{ matrix.pyxis.version }} / slurm ${{ matrix.slurm.version }} / enroot ${{ matrix.enroot.version }} / ${{ matrix.distribution }}
    needs: [build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    strategy:
      fail-fast: false
      matrix:
        slurm:
          - version: 25.11.8
            apt_version: 25.11.8-1
          - version: 26.05.4-nebius-1
            apt_version: 26.05.4-nebius-1
        enroot:
          - version: 4.2.1
        pyxis:
          - version: 0.24.0
        distribution:
          - ubuntu24.04
          - ubuntu26.04

    concurrency:
      group: release-pyxis-${{ matrix.pyxis.version }}-slurm-${{ matrix.slurm.version }}-enroot-${{ matrix.enroot.version }}-${{ matrix.distribution }}
      cancel-in-progress: false

    steps:
      - name: Download all DEB artifacts for this version set
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          pattern: debs-${{ matrix.distribution }}-pyxis_${{ matrix.pyxis.version }}-slurm_${{ matrix.slurm.version }}-enroot_${{ matrix.enroot.version }}-*
          merge-multiple: true

      - name: Show downloaded debs
        run: |
          find artifacts -type f -name "*.deb" -print

      - name: Create GitHub Release and upload all DEBs
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: pyxis-${{ matrix.pyxis.version }}_slurm_${{ matrix.slurm.version }}_enroot_${{ matrix.enroot.version }}_${{ matrix.distribution }}
          name: Pyxis ${{ matrix.pyxis.version }} for Slurm ${{ matrix.slurm.version }} and ${{ matrix.distribution }}
          body: Pyxis ${{ matrix.pyxis.version }} for Slurm ${{ matrix.slurm.version }}, Enroot ${{ matrix.enroot.version }} and ${{ matrix.distribution }}
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          files: |
            artifacts/**/*.deb
