# ATF detects cores in each test's working directory.
kernel.core_pattern=%e.core.%p.%t

# ATF invokes gdb/gcore against failed daemons.
kernel.yama.ptrace_scope=0

# common/test_conmgr creates an unprivileged user+network namespace and maps
# the invoking ATF user to uid 0 inside it. Ubuntu 24.04's AppArmor restriction
# otherwise makes the /proc/self/uid_map write fail with EPERM.
kernel.apparmor_restrict_unprivileged_userns=0
