# Slurm source tree containing configure.ac and src/.
SlurmSourceDir=/opt/slurm-atf/sut/src

# Out-of-tree directory where configure and make were run.
SlurmBuildDir=/opt/slurm-atf/sut/build

# Isolated installation prefix used only by this ATF environment.
SlurmInstallDir=/opt/slurm-atf/install

# Compiled-in sysconfdir.
SlurmConfigDir=/opt/slurm-atf/install/etc
